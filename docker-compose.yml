name: andina-pedidos

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-andina_pedidos}
      DB_USER: ${DB_USER:-andina_app}
      DB_PASSWORD_FILE: /run/andina/db_password
      TZ: America/Bogota
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public:/var/www/html:ro
      - clave_aplicacion:/run/andina:ro

  db:
    image: mysql:8.0
    entrypoint: ["/bin/sh", "/usr/local/bin/andina-preparar-claves.sh"]
    command: --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-andina_pedidos}
      MYSQL_USER: ${DB_USER:-andina_app}
      MYSQL_PASSWORD_FILE: /run/andina/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/andina_root/root_password
      ANDINA_DB_PASSWORD: ${DB_PASSWORD:-}
      ANDINA_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      TZ: America/Bogota
    volumes:
      - datos_mysql:/var/lib/mysql
      - clave_aplicacion:/run/andina
      - clave_root:/run/andina_root
      - ./db/docker/preparar-claves.sh:/usr/local/bin/andina-preparar-claves.sh:ro
      - ./db/docker/mysql-root.sh:/usr/local/bin/andina-mysql-root.sh:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  datos_mysql:
  clave_aplicacion:
  clave_root:
